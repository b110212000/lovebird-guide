name: Build Banana PWA app icons
on:
  push:
    branches: [main]
    paths:
      - "icons/banana.svg"
      - ".github/workflows/build-pwa-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG converter
        run: python3 -m pip install --user cairosvg
      - name: Render iPhone and PWA PNG icons
        run: |
          python3 - <<'PY'
          import cairosvg
          for size in (180, 192, 512):
              cairosvg.svg2png(
                  url="icons/banana.svg",
                  write_to=f"icons/banana-{size}.png",
                  output_width=size, output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/banana-180.png icons/banana-192.png icons/banana-512.png
          if ! git diff --cached --quiet; then
            git commit -m "build: generate Banana PWA raster icons"
            git push
          fi
