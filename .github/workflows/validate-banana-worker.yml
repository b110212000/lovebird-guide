name: Validate Banana Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/validate-banana-worker.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir ./dist
