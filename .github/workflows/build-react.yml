name: Build Banana React PWA
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/build.mjs"
      - "package.json"
      - ".github/workflows/build-react.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React and bundler
        run: npm install --no-audit --no-fund
      - name: Build the production website
        run: npm run build
      - name: Publish static assets to GitHub Pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js package-lock.json assets/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish React PWA v2.3.0"
            git push origin HEAD:main
          fi
